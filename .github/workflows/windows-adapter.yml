name: Windows Adapter EXE
on:
  push:
    branches: ['**']
    paths: ['windows-adapter/**', '.github/workflows/windows-adapter.yml']
    tags: ['adapter-v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows-adapter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -p "test_*.py"
      - run: python check_release.py
      - run: python -m PyInstaller --clean --noconfirm TokenMonitorAdapter.spec
      - name: Frozen EXE smoke test
        shell: pwsh
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP 'adapter-smoke'
          $p = Start-Process .\dist\TokenMonitorAdapter.exe -ArgumentList @('--self-test','--root', $testRoot) -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'EXE self-test failed' }
          $result = Get-Content (Join-Path $testRoot 'self-test-result.json') | ConvertFrom-Json
          if (-not $result.ok -or -not $result.frozen) { throw 'EXE receipt invalid' }
          (Get-FileHash .\dist\TokenMonitorAdapter.exe -Algorithm SHA256).Hash.ToLower() + '  TokenMonitorAdapter.exe' | Set-Content .\dist\SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TokenMonitorAdapter-Windows-x64
          path: |
            windows-adapter/dist/TokenMonitorAdapter.exe
            windows-adapter/dist/SHA256SUMS.txt
  release:
    if: startsWith(github.ref, 'refs/tags/adapter-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: TokenMonitorAdapter-Windows-x64
          path: release
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/TokenMonitorAdapter.exe release/SHA256SUMS.txt --draft --title "Token Monitor Adapter $GITHUB_REF_NAME" --notes-file windows-adapter/RELEASE.md
