name: Validate private NAS image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t token-monitor-test .
      - run: docker run --rm -v "$PWD/app/tests:/opt/token-monitor/tests:ro" token-monitor-test node --test 'tests/agent/*.test.js'
      - name: Check privacy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: test "$(gh api "repos/${GITHUB_REPOSITORY}" --jq .visibility)" = private
