name: Test and publish NAS image
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: token-monitor-hermes-publish
  cancel-in-progress: false
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check publication safety
        run: python3 scripts/check-publication-safety.py
      - name: Build and test without NAS data
        run: |
          docker build -t token-monitor-test .
          docker run --rm -v "$PWD/app/tests:/opt/token-monitor/tests:ro" token-monitor-test node --test 'tests/agent/*.test.js'
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish versioned image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/gott-mit-uns/token-monitor-hermes:0.54.0-nas.2
            ghcr.io/gott-mit-uns/token-monitor-hermes:sha-${{ github.sha }}
          build-args: |
            BUILD_VERSION=0.54.0-nas.2
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify both runtime architectures
        run: |
          image=ghcr.io/gott-mit-uns/token-monitor-hermes:sha-${GITHUB_SHA}
          for platform in linux/amd64 linux/arm64; do
            docker pull --platform "$platform" "$image"
            docker run --rm --platform "$platform" \
              -v "$PWD/app/tests:/opt/token-monitor/tests:ro" \
              "$image" node --test 'tests/agent/*.test.js'
          done
      - name: Promote verified image to latest
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/gott-mit-uns/token-monitor-hermes:latest \
            ghcr.io/gott-mit-uns/token-monitor-hermes:sha-${GITHUB_SHA}
          docker buildx imagetools inspect ghcr.io/gott-mit-uns/token-monitor-hermes:latest
