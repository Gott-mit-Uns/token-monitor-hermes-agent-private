name: Test and publish NAS image
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: token-monitor-nas-publish
  cancel-in-progress: false
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check publication safety
        run: python3 scripts/check-publication-safety.py
      - name: Read release version
        id: version
        run: |
          version=$(node scripts/check-nas-version.js)
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Build and test without NAS data
        run: |
          docker build -t token-monitor-test .
          docker run --rm -v "$PWD/app/tests:/opt/token-monitor/tests:ro" -v "$PWD/app/scripts:/opt/token-monitor/scripts:ro" token-monitor-test node scripts/test-nas.js
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish candidate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/gott-mit-uns/token-monitor-hermes:sha-${{ github.sha }}
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.value }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify both runtime architectures
        run: |
          image=ghcr.io/gott-mit-uns/token-monitor-hermes:sha-${GITHUB_SHA}
          for platform in linux/amd64 linux/arm64; do
            docker pull --platform "$platform" "$image"
            docker run --rm --platform "$platform" \
              -v "$PWD/app/tests:/opt/token-monitor/tests:ro" -v "$PWD/app/scripts:/opt/token-monitor/scripts:ro" \
              "$image" node scripts/test-nas.js
          done
      - name: Publish immutable version after verification
        env:
          NAS_VERSION: ${{ steps.version.outputs.value }}
        run: |
          version_image=ghcr.io/gott-mit-uns/token-monitor-hermes:${NAS_VERSION}
          if docker buildx imagetools inspect "$version_image" >/tmp/version-inspect.out 2>/tmp/version-inspect.err; then
            echo "Version already exists; refusing to overwrite or repoint latest."
            exit 1
          elif grep -Eqi 'manifest unknown|not found' /tmp/version-inspect.err; then
            docker buildx imagetools create --tag "$version_image" \
              ghcr.io/gott-mit-uns/token-monitor-hermes:sha-${GITHUB_SHA}
          else
            echo "Unable to confirm version absence; refusing to publish a fixed tag."
            exit 1
          fi
      - name: Promote verified image to latest
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/gott-mit-uns/token-monitor-hermes:latest \
            ghcr.io/gott-mit-uns/token-monitor-hermes:sha-${GITHUB_SHA}
          docker buildx imagetools inspect ghcr.io/gott-mit-uns/token-monitor-hermes:latest
